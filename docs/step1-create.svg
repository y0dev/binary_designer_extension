<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Segoe UI, system-ui, sans-serif" font-size="13">
  <rect width="680" height="300" fill="#1e1e1e"/>
  <text x="24" y="34" fill="#9ca3af" font-size="12">Command Palette — <tspan fill="#d4d4d4">Ctrl/Cmd+Shift+P</tspan></text>

  <!-- palette -->
  <rect x="120" y="48" width="440" height="180" rx="6" fill="#252526" stroke="#454545"/>
  <rect x="132" y="60" width="416" height="26" rx="3" fill="#3c3c3c" stroke="#007acc"/>
  <text x="142" y="78" fill="#e6e6e6">&gt; Binary Designer: Create Design</text>

  <rect x="132" y="92" width="416" height="26" fill="#04395e"/>
  <text x="142" y="110" fill="#ffffff">Binary Designer: Create Design</text>
  <text x="540" y="110" fill="#9cc7f5" text-anchor="end" font-size="11">recently used</text>

  <text x="142" y="140" fill="#c9c9c9">Binary Designer: Generate C Header</text>
  <text x="142" y="166" fill="#c9c9c9">Binary Designer: Generate Sample Binary</text>
  <text x="142" y="192" fill="#c9c9c9">Binary Designer: Generate Layout Doc</text>
  <text x="142" y="218" fill="#c9c9c9">Binary Designer: Round-trip Check</text>

  <!-- input box for the name -->
  <rect x="120" y="244" width="440" height="30" rx="4" fill="#252526" stroke="#007acc"/>
  <text x="132" y="264" fill="#e6e6e6">SensorFrame</text>
  <text x="552" y="264" fill="#9ca3af" text-anchor="end" font-size="11">a valid C identifier ↵</text>
</svg>
