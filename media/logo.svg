<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#0b8c8c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="12" y="12" width="232" height="232" rx="48" fill="url(#bg)"/>
  <rect x="12" y="12" width="232" height="232" rx="48" fill="url(#sheen)"/>
  <rect x="12.5" y="12.5" width="231" height="231" rx="47.5" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>

  <!-- offset column: binary ticks -->
  <g font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="15" font-weight="700" fill="#ffffff" fill-opacity="0.55">
    <text x="46" y="86" text-anchor="end">01</text>
    <text x="46" y="118" text-anchor="end">10</text>
    <text x="46" y="150" text-anchor="end">00</text>
    <text x="46" y="182" text-anchor="end">11</text>
  </g>
  <line x1="58" y1="60" x2="58" y2="196" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>

  <!-- struct field rows (echoes the layout preview) -->
  <g>
    <rect x="70" y="70" width="96"  height="20" rx="6" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="70" y="102" width="130" height="20" rx="6" fill="#ffe08a"/>
    <rect x="70" y="134" width="72"  height="20" rx="6" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="70" y="166" width="112" height="20" rx="6" fill="#8ce8d0"/>
  </g>

  <!-- struct brace -->
  <path d="M212 66
           c-14 0 -20 8 -20 22
           v14 c0 12 -5 18 -14 20
           c9 2 14 8 14 20
           v14 c0 14 6 22 20 22"
        fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
